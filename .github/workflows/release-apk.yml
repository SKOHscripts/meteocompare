# Release de test du fork : à chaque push sur une branche release/**,
# compile l'APK debug après la suite de tests JVM. Si la version indiquée
# dans .github/release-version n'a pas encore de release, le workflow crée
# le tag correspondant sur ce commit et publie une pré-release GitHub avec
# les notes .github/release-notes/<version>.md. Pour publier un nouveau
# build de test : incrémenter la version dans ce fichier et pousser.
#
# release/all-fixes est la branche unique qui cumule toutes les corrections
# proposées à l'auteur ; chaque push y produit aussi l'APK en artefact.
#
# Le préfixe « skoh- » évite de déclencher le workflow F-Droid de l'auteur
# (tags v*). Présent uniquement sur les branches release du fork, jamais
# dans les branches proposées en PR.
name: Release de test (fork)

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: APK debug
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(tr -d '[:space:]' < .github/release-version)"
          case "$tag" in skoh-v*) ;; *) echo "Version invalide : $tag" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release $tag existe déjà : build vérifié, rien n'est publié."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer l'APK
        id: apk
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          name="meteocompare-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}*
          retention-days: 30

      # Ménage ponctuel du fork : ancienne pré-release test-build et branches
      # remplacées par release/all-fixes. Une branche n'est supprimée que si
      # sa tête est encore le commit obsolète connu. Étape retirée ensuite.
      - name: Nettoyer les anciennes branches de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          delete_if_at() {
            head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$1" --jq .object.sha 2>/dev/null || true)"
            if [ "$head" = "$2" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$1" && echo "Branche $1 supprimée"
            else
              echo "Branche $1 conservée (tête : ${head:-absente})"
            fi
          }
          delete_if_at test/all-fixes abc764f726d939248888b646df12614468144a29
          delete_if_at fix/unknown-error-outside-europe 50e9757e5aa6efbb14ec064080e71e85d00be8ac

      - name: Publier la pré-release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MeteoCompare ${TAG#skoh-v} — build de test" \
            "${notes_args[@]}"
