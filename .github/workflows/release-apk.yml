# Release de test du fork : pour chaque tag skoh-v*, compile l'APK debug
# après la suite de tests JVM et publie une pré-release GitHub versionnée
# avec les notes .github/release-notes/<tag>.md.
#
# Le préfixe « skoh- » évite de déclencher le workflow F-Droid de l'auteur
# (tags v*). Présent uniquement sur les branches release/test du fork,
# jamais dans les branches proposées en PR.
name: Release de test (fork)

on:
  push:
    tags:
      - 'skoh-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: APK debug
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Préparer l'APK
        id: apk
        run: |
          name="meteocompare-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publier la pré-release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --prerelease \
            --verify-tag \
            --title "MeteoCompare ${GITHUB_REF_NAME#skoh-v} — build de test" \
            "${notes_args[@]}"
