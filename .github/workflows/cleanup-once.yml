# Nettoyage ponctuel du fork, supprimé dès le commit suivant.
#
# Branches des PR déjà fusionnées (#9, #6) et pré-releases 1.14.5.1 / 1.14.5.2,
# signées avec des clés aléatoires et donc inutilisables pour mettre à jour
# l'app de test. Une branche n'est supprimée que si sa tête est encore le
# commit attendu ; une release, que si c'est bien une pré-release.
name: Nettoyage ponctuel du fork

on:
  push:
    branches:
      - release/all-fixes
    paths:
      - .github/workflows/cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Supprimer les branches fusionnées
        run: |
          delete_branch() {
            branch="$1"; expected="$2"
            head="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)"
            if [ "$head" = "$expected" ]; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              echo "Branche supprimée : $branch"
            else
              echo "Branche conservée : $branch (tête « ${head:-absente} », attendu $expected)"
            fi
          }
          delete_branch fix/bias-history-progress 0bc88660026ea520404957591921e118670a3745
          delete_branch feat/weather-notifications ddf0b42dfa49764c6de96193ae6264b8326863f4

      - name: Supprimer les anciennes pré-releases
        run: |
          for tag in skoh-v1.14.5.1 skoh-v1.14.5.2; do
            if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease 2>/dev/null)" = "true" ]; then
              gh release delete "$tag" --cleanup-tag --yes
              echo "Pré-release et tag supprimés : $tag"
            else
              echo "Rien à supprimer pour $tag"
            fi
          done
