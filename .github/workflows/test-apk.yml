# APK de test pour le fork : compile une version debug des branches test/**
# et la publie en pré-release « test-build » (téléchargeable depuis un
# téléphone) ainsi qu'en artefact du run.
#
# Présent uniquement sur les branches de test du fork, jamais dans les
# branches proposées en PR. La variante debug (com.meteocompare.app.debug)
# s'installe à côté de l'application officielle sans la remplacer.
name: APK de test (fork)

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Les tests JVM bloquent la publication : un APK n'est proposé au
      # test que si la suite unitaire est verte.
      - name: Tests unitaires
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: APK debug
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Nommer l'APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          name="meteocompare-${branch}-${short_sha}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      # Pré-release glissante : toujours le dernier build, à la même adresse.
      - name: Publier la pré-release test-build
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de test — $GITHUB_REF_NAME ($(git rev-parse --short HEAD))" \
            --notes "Build debug de \`$GITHUB_REF_NAME\` au commit $GITHUB_SHA.
          S'installe à côté de l'application officielle (paquet com.meteocompare.app.debug).
          Contenu : corrections #4, #2 et #3 (voir les PR ouvertes sur Pat0chat/meteocompare)."
